# src/config.yaml

# Configuration centrale du pipeline cinedata (extraction TMDB/Wikipedia/MovieLens,
# chemins des fichiers de données et connexion base de données).

api_tmdb:
  base_url: "https://api.themoviedb.org/3"
  timeout: 5          # délai max (en secondes) avant abandon d'une requête TMDB
  language: "en-EN"   # langue des données retournées par l'API TMDB

# Chemins des fichiers de données, relatifs à la racine du projet
path:
  raw_tmdb: "data/raw/tmdb.json"                  # extraction brute TMDB (movies + missing)
  ml_ratings: "data/raw/ml_ratings.csv"           # notes MovieLens (source des vote_average_ml / vote_count_ml)
  ml_links: "data/raw/ml_links.csv"               # table de correspondance MovieLens <-> TMDB (tmdbId)
  raw_wiki: "data/raw/wiki.json"                  # enrichissement budget/revenue scrappé sur Wikipedia
  export: "data/processed/export_to_db.csv"       # fichier final prêt à charger en base

wikipedia:
  base_url: "https://en.wikipedia.org"  # utilisé pour construire les URLs de recherche/scraping

data_quality:
  min_reliable: 100_000   # montant minimum (en $) pour qu'un budget/revenu TMDB soit jugé fiable

database:
  schema: "sql/schema.sql"
  db_file: "data/db/cinedata.db"

pipeline:
  db_entry: 1000           # nombre d'entrée souhaité dans la DB
  force_refresh: false     # force le rafraichissement du pipeline (true), false utilise les CSV si dispo

recommendation:
  sql_file: recommendation.sql
  top_n: 5
  artefact_path: data/models/recommendation.joblib

llm:
  provider: mistral
  model: ministral-14b-2512
  temperature: 0.7
  max_token: 400
  max_try: 3
  pause_init: 2.0
  pause: 1